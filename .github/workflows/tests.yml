name: UI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run UI tests
        run: python -m pytest -v --html=reports/report.html --self-contained-html
        env:
          HEADLESS: "true"

      - name: Upload test report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            reports/report.html
            screenshots/
          if-no-files-found: ignore
